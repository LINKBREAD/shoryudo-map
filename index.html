<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本升龙道 枫叶季 巡礼地图</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>

<style>
  :root{
    --hotel:#F4A300; --tourist:#E63946; --anime:#7C3AED;
    --shira:#0E9594; --kanazawa:#2563EB; --nagoya:#EA580C; --ref:#64748B;
    --bg:#eef1f5; --panel:#ffffff; --ink:#222633; --muted:#6b7280; --line:#e5e7eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);overflow:hidden}
  #app{display:flex;height:100vh;overflow:hidden;position:relative}

  /* 侧栏 */
  #sidebar{width:360px;min-width:360px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:margin-left .3s ease;z-index:1000}
  #sidebar.collapsed{margin-left:-360px}
  #side-head{padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
  #side-head h1{font-size:18px;margin:0 0 4px;padding-right:28px}
  #side-head .sub{font-size:12px;color:var(--muted)}
  #side-close{position:absolute;top:14px;right:12px;width:28px;height:28px;border:none;background:#f0f1f4;border-radius:8px;font-size:16px;cursor:pointer;color:#666;display:flex;align-items:center;justify-content:center;line-height:1}
  #side-close:hover{background:#e2e5ea}
  #legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:#444}
  .lg .d{width:11px;height:11px;border-radius:50%}
  #filters{padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
  .chip{font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#f7f8fa;cursor:pointer;user-select:none}
  .chip.off{opacity:.4;text-decoration:line-through}
  #list{flex:1;overflow-y:auto;padding:6px 10px 20px;-webkit-overflow-scrolling:touch}
  .group-title{font-size:12px;font-weight:700;color:var(--muted);margin:12px 6px 6px;letter-spacing:.5px}
  .card{display:flex;gap:10px;padding:8px;border-radius:12px;cursor:pointer;transition:background .15s}
  .card:hover{background:#f3f5f9}
  .card:active{background:#e8ecf2}
  .card .thumb{width:78px;height:60px;flex:0 0 78px;border-radius:9px;object-fit:cover;background:#e9edf2;display:flex;align-items:center;justify-content:center;color:#9aa3b2;font-size:10px;overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover}
  .card .thumb-ph, .pop-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;background:linear-gradient(135deg,#9aa6b8,#6b7689)}
  .pop-img-ph{height:150px;border-radius:8px;margin-bottom:8px;font-size:34px}
  .card .info{min-width:0;flex:1}
  .card .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .card .nm .badge{font-size:10px;color:#fff;border-radius:5px;padding:1px 5px;font-weight:700}
  .card .meta{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .hist{font-size:11px;color:#555;margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* 纯文字列表（巡礼/购物）—— 靠左无缩略图，撑满侧栏宽度 */
  .text-item{padding:5px 14px;border-bottom:1px solid #f0f1f4;cursor:pointer;transition:background .12s;font-size:13px;line-height:1.4;margin:0 -10px}
  .text-item:hover{background:#f3f5f9}
  .text-item:active{background:#e8ecf2}
  .text-item .ti-id{font-size:10px;color:#fff;border-radius:4px;padding:1px 5px;font-weight:700;margin-right:5px}
  .text-item .ti-name{font-weight:600}
  .text-item .ti-meta{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 地图 */
  #map{flex:1;height:100%;z-index:1}
  .leaflet-popup-content-wrapper{border-radius:12px}
  .pop{max-width:260px}
  .pop img{width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:8px;background:#eee}
  .pop .pt{font-size:15px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px}
  .pop .pb{font-size:10px;color:#fff;border-radius:5px;padding:1px 6px;font-weight:700}
  .pop .row{font-size:12px;color:#444;margin:3px 0}
  .pop .row b{color:#222}
  .pop .hist{font-size:12px;color:#444;line-height:1.55;margin-top:6px}
  .pop .near{font-size:11.5px;color:#0b6; background:#eafaf1;border-radius:8px;padding:6px 8px;margin-top:7px;line-height:1.5}

  /* 侧栏开关按钮 */
  #sideOpen{position:absolute;top:12px;left:12px;z-index:999;width:42px;height:42px;border:none;background:#fff;border-radius:10px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);display:none;align-items:center;justify-content:center;color:#333}
  #sideOpen:active{background:#f0f1f4}

  /* 右上角控件 */
  .ctrl{position:absolute;top:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:8px}
  .ctrl button{background:#fff;border:1px solid #d6dae1;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12);color:#222}
  .ctrl button.active{background:#2563eb;color:#fff;border-color:#2563eb}
  .loading{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:1000;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:6px 14px;font-size:12px;color:#555;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .foot{font-size:10.5px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line);line-height:1.5}

  /* 瓦片加载失败提示 */
  #tileHint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:8px 14px;font-size:12px;color:#856404;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;max-width:90%;text-align:center;line-height:1.5}

  /* Leaflet 图层切换器样式微调 */
  .leaflet-control-layers{border-radius:10px!important;box-shadow:0 2px 8px rgba(0,0,0,.15)!important}
  .leaflet-control-layers label{font-size:12px;margin:3px 0}
  .leaflet-control-layers-toggle{background-image:none!important;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .leaflet-control-layers-toggle::before{content:'🗺'}

  /* 手机端 */
  @media(max-width:760px){
    #sidebar{position:absolute;width:86%;max-width:340px;height:100%;box-shadow:2px 0 16px rgba(0,0,0,.25);z-index:1100}
    #sidebar.collapsed{margin-left:-86%}
    #sideOpen{display:flex}
    #side-close{width:34px;height:34px;font-size:18px}
    .ctrl{top:12px;right:8px;gap:6px}
    .ctrl button{padding:7px 10px;font-size:12px}
    .pop{max-width:220px}
  }
</style>
</head>

// ---------- 路线 ----------
const TRIP_ROUTE = ['N1','H1','H2','S1','K1'];   // 名古屋→下吕→高山→白川乡→金泽
const ANIME_ROUTE = ['A1','A2','A3','A4','A5','A6','A7'];

// ---------- 地图初始化 ----------
const map = L.map('map', {zoomControl:true, tap:true}).setView([36.0, 137.1], 9);

// 多底图源 —— 手机在国内也能加载
const baseLayers = {};

// 1. OSM 标准底图（全球通用）
baseLayers['OpenStreetMap'] = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  subdomains:'abc', maxZoom:19,
  attribution:'&copy; OpenStreetMap'
});

// 2. CARTO Voyager（苹果探索风格）
baseLayers['CARTO 探索风'] = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  subdomains:'abcd', maxZoom:19,
  attribution:'&copy; OpenStreetMap &copy; CARTO'
});

// 3. 高德地图（国内速度快）
baseLayers['高德地图'] = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains:['1','2','3','4'], maxZoom:18,
  attribution:'&copy; AutoNavi'
});

// 默认底图：优先 CARTO，如果加载失败会提示切换
let currentBase = baseLayers['CARTO 探索风'].addTo(map);

// 图层切换器
L.control.layers(baseLayers, null, {position:'topright', collapsed:true}).addTo(map);

// 监听底图切换
map.on('baselayerchange', function(e){
  currentBase = e.layer;
  hideTileHint();
});

// 瓦片加载失败检测
let tileLoadFailCount = 0;
let tileLoadTotal = 0;
map.on('tileerror', function(){
  tileLoadFailCount++;
  tileLoadTotal++;
  if(tileLoadFailCount >= 3){
    showTileHint();
  }
});
map.on('tileload', function(){
  tileLoadTotal++;
});
function showTileHint(){
  const el = document.getElementById('tileHint');
  if(el) el.style.display = 'block';
}
function hideTileHint(){
  const el = document.getElementById('tileHint');
  if(el) el.style.display = 'none';
}

const imgCache = {};   // id -> 图片URL
const markers = {};    // id -> marker

function badgeHTML(spot){
  return `<span class="badge" style="background:${CATS[spot.cat].color}">${spot.id}</span>`;
}
function iconHTML(spot){
  return L.divIcon({
    className:'', html:`<div style="width:30px;height:30px;border-radius:50%;background:${CATS[spot.cat].color};color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${spot.id}</div>`,
    iconSize:[30,30], iconAnchor:[15,15]
  });
}
function popupHTML(spot){
  const imgSrc = spot.photo || imgCache[spot.id];
  const img = imgSrc
    ? `<img src="${imgSrc}" alt="${spot.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="pop-img-ph" style="display:none">${CATS[spot.cat].icon}</div>`
    : `<div class="pop-img-ph">${CATS[spot.cat].icon}</div>`;
  return `<div class="pop">
    ${img}
    <div class="pt">${spot.name} ${badgeHTML(spot)}</div>
    <div class="row"><b>地址</b>：${spot.addr}</div>
    <div class="row"><b>时间</b>：${spot.hours}</div>
    <div class="row"><b>门票</b>：${spot.fee}</div>
    <div class="hist">${spot.hist}</div>
    <div class="near">📍 周边参考：${spot.near}</div>
  </div>`;
}

// 标记
SPOTS.forEach(s=>{
  const m = L.marker([s.lat,s.lng],{icon:iconHTML(s)}).addTo(map);
  m.on('click', ()=>{ m.bindPopup(popupHTML(s)).openPopup(); });
  markers[s.id]=m;
});

// 路线
function buildPolyline(ids, color, dash){
  const pts = ids.map(id=>{const s=SPOTS.find(x=>x.id===id);return [s.lat,s.lng];});
  return L.polyline(pts,{color:color, weight:4, opacity:.85, dashArray:dash, lineJoin:'round'});
}
const tripLine = buildPolyline(TRIP_ROUTE, '#F59E0B', null).addTo(map);
const animeLine = buildPolyline(ANIME_ROUTE, '#7C3AED', '8,7').addTo(map);

// ---------- 侧栏 ----------
function buildLegend(){
  const el = document.getElementById('legend');
  el.innerHTML = Object.values(CATS).map(c=>
    `<span class="lg"><span class="d" style="background:${c.color}"></span>${c.icon} ${c.name}</span>`).join('');
}
function buildFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = Object.entries(CATS).map(([k,c])=>
    `<span class="chip" data-cat="${k}" style="border-color:${c.color}">${c.icon} ${c.name}</span>`).join('');
  el.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=()=>{
      ch.classList.toggle('off');
      const cat=ch.dataset.cat, on=!ch.classList.contains('off');
      SPOTS.filter(s=>s.cat===cat).forEach(s=>{
        if(on){ if(!map.hasLayer(markers[s.id])) markers[s.id].addTo(map);}
        else { if(map.hasLayer(markers[s.id])) map.removeLayer(markers[s.id]); }
      });
    };
  });
}
function buildList(){
  const list = document.getElementById('list');
  list.innerHTML='';
  const TEXT_CATS = ['anime','shopping']; // 这两类用纯文字靠左，不放预览图
  Object.entries(CATS).forEach(([k,c])=>{
    const items = SPOTS.filter(s=>s.cat===k);
    if(!items.length) return;
    list.insertAdjacentHTML('beforeend', `<div class="group-title" style="color:${c.color}">${c.icon} ${c.name}</div>`);
    if(TEXT_CATS.includes(k)){
      // 纯文字列表，靠左无缩略图
      items.forEach(s=>{
        const div = document.createElement('div');
        div.className='text-item';
        div.innerHTML = `<span class="ti-id" style="background:${c.color}">${s.id}</span><span class="ti-name">${s.name}</span><div class="ti-meta">${s.addr}</div>`;
        div.onclick=()=>{
          focusSpot(s.id);
          if(window.innerWidth <= 760) collapseSidebar();
        };
        list.appendChild(div);
      });
    } else {
      // 带缩略图的卡片列表（本地图片用thumbs/小图，出错时回退原图，再回退占位图标）
      items.forEach(s=>{
        const thumbSrc = s.photo || imgCache[s.id];
        const thumbFile = thumbSrc && thumbSrc.indexOf('photos/') === 0
          ? thumbSrc.replace('photos/','thumbs/') : thumbSrc;
        const thumb = thumbSrc
          ? `<div class="thumb"><img src="${thumbFile}" alt="" loading="lazy" data-full="${thumbSrc}" onerror="if(this.dataset.f){imgFail(this,'${CATS[s.cat].icon}')}else{this.dataset.f=1;this.src=this.dataset.full}"></div>`
          : `<div class="thumb"><div class="thumb-ph">${CATS[s.cat].icon}</div></div>`;
        const div = document.createElement('div');
        div.className='card';
        div.innerHTML = `${thumb}
          <div class="info">
            <div class="nm">${badgeHTML(s)} ${s.name}</div>
            <div class="meta">${s.addr}</div>
            <div class="hist">${s.hist}</div>
          </div>`;
        div.onclick=()=>{
          focusSpot(s.id);
          if(window.innerWidth <= 760) collapseSidebar();
        };
        list.appendChild(div);
      });
    }
  });
  document.getElementById('cnt').textContent = SPOTS.length;
}
function focusSpot(id){
  const s = SPOTS.find(x=>x.id===id); if(!s) return;
  map.flyTo([s.lat,s.lng], 15, {duration:.8});
  const m = markers[id];
  if(!map.hasLayer(m)) m.addTo(map);
  m.bindPopup(popupHTML(s)).openPopup();
}

// ---------- 侧栏收缩 ----------
const sidebar = document.getElementById('sidebar');
const sideOpen = document.getElementById('sideOpen');
const sideClose = document.getElementById('side-close');
function collapseSidebar(){ sidebar.classList.add('collapsed'); sideOpen.style.display='flex'; }
function expandSidebar(){ sidebar.classList.remove('collapsed'); if(window.innerWidth > 760) sideOpen.style.display='none'; }
sideClose.onclick = collapseSidebar;
sideOpen.onclick = expandSidebar;

// 手机端默认收起侧栏
if(window.innerWidth <= 760){ collapseSidebar(); }

// ---------- 控件 ----------
document.getElementById('bTrip').onclick=()=>{
  const b=document.getElementById('bTrip');
  if(map.hasLayer(tripLine)){map.removeLayer(tripLine);b.classList.remove('active');}
  else{tripLine.addTo(map);b.classList.add('active');}
};
document.getElementById('bAni').onclick=()=>{
  const b=document.getElementById('bAni');
  if(map.hasLayer(animeLine)){map.removeLayer(animeLine);b.classList.remove('active');}
  else{animeLine.addTo(map);b.classList.add('active');}
};
document.getElementById('bAll').onclick=()=>{
  map.flyToBounds(L.latLngBounds(SPOTS.map(s=>[s.lat,s.lng])).pad(.12), {duration:.8});
};

// ---------- 客户端从 Wikimedia Commons 拉取真实预览图（并行+超时，不阻塞页面） ----------
const BAD_IMG = /(\.svg|logo|flag|map|icon|coat|symbol|diagram|banner|stamp)/i;
async function loadWikiImage(term){
  const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json'
    + '&generator=search&gsrsearch=' + encodeURIComponent(term)
    + '&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|mime&iiurlwidth=640&origin=*';
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 4000);
  try{
    const res = await fetch(url, {signal: ctrl.signal});
    const data = await res.json();
    const pages = (data.query && data.query.pages) || {};
    for(const k in pages){
      const ii = pages[k].imageinfo; if(!ii) continue;
      const info = ii[0]; const title = pages[k].title||'';
      if(['image/jpeg','image/png'].includes(info.mime) && !BAD_IMG.test(title)){
        return info.thumburl || info.url;
      }
    }
  }catch(e){}
  finally{ clearTimeout(timer); }
  return null;
}
function imgFail(el, emo){
  el.style.display='none';
  const d = document.createElement('div');
  d.className='thumb-ph'; d.textContent = emo || '🏷';
  el.parentNode.appendChild(d);
}
async function preloadImages(){
  // 有本地实拍图的景点直接用本地图，跳过API请求；其余并行请求维基图
  const needWiki = SPOTS.filter(s => !s.photo);
  const results = await Promise.all(needWiki.map(async s => {
    let u = await loadWikiImage(s.wiki);
    if(!u && s.wiki2) u = await loadWikiImage(s.wiki2);
    if(!u) u = await loadWikiImage(s.name);
    return [s.id, u];
  }));
  results.forEach(([id, u]) => { if(u) imgCache[id] = u; });
  const ld = document.getElementById('loading'); if(ld) ld.style.display='none';
  buildList(); // 图片就位后刷新侧栏缩略图
}

// ---------- 启动 ----------
buildLegend();
buildFilters();
buildList();
preloadImages();
